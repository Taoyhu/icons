<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>热门排行榜图标合集</title>
<style>
  body { margin:0; background:#14161a; color:#e8e9eb; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:28px 20px 8px; text-align:center; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.sub { color:#9aa0a8; font-size:13px; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; padding:22px; max-width:1200px; margin:0 auto; }
  .card { background:#1d2026; border:1px solid #2c3038; border-radius:12px; overflow:hidden; }
  .card img { width:100%; display:block; }
  .meta { padding:12px 14px; display:flex; justify-content:space-between; align-items:center; }
  .name { font-weight:600; }
  .url { color:#7ea6ff; font-size:12px; word-break:break-all; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>热门排行榜 · 图标合集</h1>
  <p class="sub">2321 × 1475 · 透明底 PNG · 点击图片名打开原图</p>
</header>
<div class="grid">
  <div class="card">
    <img src="Benri.PNG" alt="本日">
    <div class="meta"><span class="name">本日 Benri</span><a class="url" href="Benri.PNG">Benri.PNG</a></div>
  </div>
  <div class="card">
    <img src="Benzhou.PNG" alt="本周">
    <div class="meta"><span class="name">本周 Benzhou</span><a class="url" href="Benzhou.PNG">Benzhou.PNG</a></div>
  </div>
  <div class="card">
    <img src="Benyue.PNG" alt="本月">
    <div class="meta"><span class="name">本月 Benyue</span><a class="url" href="Benyue.PNG">Benyue.PNG</a></div>
  </div>
  <div class="card">
    <img src="Zuixinshangchuan.PNG" alt="最新上传">
    <div class="meta"><span class="name">最新上传 Zuixinshangchuan</span><a class="url" href="Zuixinshangchuan.PNG">Zuixinshangchuan.PNG</a></div>
  </div>
  <div class="card">
    <img src="Zuixinshangshi.PNG" alt="最新上市">
    <div class="meta"><span class="name">最新上市 Zuixinshangshi</span><a class="url" href="Zuixinshangshi.PNG">Zuixinshangshi.PNG</a></div>
  </div>
  <div class="card">
    <img src="Guankancishu.PNG" alt="观看次数">
    <div class="meta"><span class="name">观看次数 Guankancishu</span><a class="url" href="Guankancishu.PNG">Guankancishu.PNG</a></div>
  </div>
  <div class="card">
    <img src="Zuigaodianzan.PNG" alt="最高点赞">
    <div class="meta"><span class="name">最高点赞 Zuigaodianzan</span><a class="url" href="Zuigaodianzan.PNG">Zuigaodianzan.PNG</a></div>
  </div>
</div>
</body>
</html>
